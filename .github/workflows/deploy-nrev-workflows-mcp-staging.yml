# Deploys the hosted nrev-workflows-mcp server (servers/workflows/) to the
# staging Kubernetes cluster. Adapted from nrev-tables-service's own
# deployment-k8s-staging.yml — trigger is push-to-`staging` + a path filter,
# matching that same convention, with the path filter added because this is
# a monorepo (other packages/services here shouldn't trigger or be included
# in this image) rather than one-service-per-repo like every sibling.
#
# This only rebuilds+redeploys the already-existing Kubernetes Deployment
# (`kubectl rollout restart`) — the initial `helm install` is a one-time
# manual bootstrap, done once from the separate helm-charts repo.
name: Deploy nrev-workflows-mcp Staging

on:
  push:
    branches:
      - staging
    paths:
      - 'servers/workflows/**'
      - '.github/workflows/deploy-nrev-workflows-mcp-staging.yml'

permissions:
  id-token: write # required for requesting the AWS OIDC JWT
  contents: read  # required for actions/checkout

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1.7.0
        with:
          role-to-assume: arn:aws:iam::979176640062:role/github-action-role
          aws-region: ap-south-1
          mask-aws-account-id: 'false'

      - name: Login to ECR
        run: |
          aws ecr get-login-password --region ap-south-1 | docker login --username AWS --password-stdin 979176640062.dkr.ecr.ap-south-1.amazonaws.com

      - name: Build and push Docker image
        working-directory: servers/workflows
        run: |
          docker build --no-cache --platform linux/amd64 -t nrev-workflows-mcp-kub .
          docker tag nrev-workflows-mcp-kub:latest 979176640062.dkr.ecr.ap-south-1.amazonaws.com/nrev-workflows-mcp-kub:latest
          docker push 979176640062.dkr.ecr.ap-south-1.amazonaws.com/nrev-workflows-mcp-kub:latest

      - name: Deploy to Kubernetes
        run: |
          echo "${{ secrets.KUBECONFIG_STAGING }}" > kubeconfig_staging
          export KUBECONFIG=kubeconfig_staging
          kubectl rollout restart deploy nrev-workflows-mcp -n staging
